<!DOCTYPE html>
<html>

<head>
  <title></title>
  <style>
    .text-message,
    .username{
      vertical-align: middle;
      margin-top: 0;
      margin-bottom: 0;
    }
  
    .message {
      width: 350px;
      background-color: white;
      border-style: solid;
      border-color: red;
    }
    
    .message-left-section {
      height: 50px;
      display: inline-block;
      margin-right: 8px;
    }
    
    .user-profile {
      vertical-align: middle;
      width: 45px;
    }
    
    .message-middle-section {
      font-size: 16px;
      display: inline-block;
      vertical-align: middle;
    }
    
    .username {
      font-weight: bold;
    }
    
    .text-message {
      color: grey;
    }
    
    .message-right-section {
      display: inline-block;
      height: 40px;
      border-style: solid;
      border-color: red;
      vertical-align: top;
    }
    
    .date {
      margin-top: 2px;
      color: rgb(0, 155, 0);
      font-size: 15px;
      margin-bottom: 2px;
    }
    
    .message-number {
       background-color: rgb(0, 230, 80);
       color: black;
       height: 20px;
       width: 20px;
       border-radius: 10px;
       border: none;
       font-weight: bold;
       margin-left: 58px;
    }
  </style>
</head>

<body>
  <div class="message">
    <div class="message-left-section">
      <img class="user-profile" src="profile/MrSS.jpeg">
    </div>
    
    <div class="message-middle-section">
        <p class="username">
          Mr SuperSimple.dev
        </p>
        <p class="text-message">
          Dave: Voice message (0:08)
        </p>
    </div>
    
      <div class="message-right-section">
        <p class="date">2026/06/11</p>
        <button class="message-number">4</button>
      </div>
    </div>
</body>

</html>
